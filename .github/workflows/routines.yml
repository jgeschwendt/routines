name: routines

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  due:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .state
          key: routines-state-${{ github.run_id }}
          restore-keys: routines-state-
      - run: bin/routine run --due
