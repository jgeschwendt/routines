# Written by `routine sync-ci` (jgeschwendt/routines), which compiles this file in: a repo's copy
# changes when it runs `routine sync-ci` again — the owner's .routines repo does after the first
# release; until then its copy fails, fetching a bash runner main no longer carries.
name: routines

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# runners share no lock: two overlapping ticks would both fire and one save would drop the other's state
concurrency:
  cancel-in-progress: false
  group: routines

jobs:
  due:
    env:
      ROUTINE_HOME: ${{ github.workspace }}/routines
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    # actions pinned by commit: a moved tag would run foreign code holding this
    # token; checkout keeps it out of .git/config, where every block could read it —
    # a block that needs git auth against origin brings its own
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: routines/.state
          key: routines-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: routines-state-
      # mise alone, no tools: the runner is jgeschwendt/routines' latest packslip release, which mise
      # verifies against its signed packslip; mise-action exports GITHUB_TOKEN to every later step,
      # so env drops it before a block runs
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: false
      # mise hides a release under 24 h old; this one is the owner's own, attested by its workflow
      - env:
          MISE_MINIMUM_RELEASE_AGE_EXCLUDES: packslip:jgeschwendt/routines
        run: mise x packslip:jgeschwendt/routines@latest -- env -u GITHUB_TOKEN routine run --due
      # actions/cache saves only on success; one red routine would roll every
      # other routine's state back and re-run it each tick
      - id: save
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: routines/.state
          key: routines-state-${{ github.run_id }}-${{ github.run_attempt }}
      # each tick saves a new key, a re-run too: it keeps run_id, and a taken key is never overwritten; once this one is saved, every older one on this ref is dead weight (a branch run must not delete main's).
      # cache/save exits 0 on a failed save too, so only this run's key in the list proves it
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
        if: always() && steps.save.outcome == 'success'
        run: gh cache list --key routines-state- --limit 100 --ref "$REF" --json id,key --jq 'any(.key == "routines-state-${{ github.run_id }}-${{ github.run_attempt }}") as $saved | .[] | select($saved and .key != "routines-state-${{ github.run_id }}-${{ github.run_attempt }}") | .id' | xargs -rn1 gh cache delete
