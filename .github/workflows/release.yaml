# A GitHub Release per merge to main, YYYY.M.N (N counts the month's releases from 0), signed by
# packslip: what `mise use -g packslip:jgeschwendt/routines` installs, `routine upgrade` swaps in
# (https://gigantic.dev/hotswap/ § release) and the CI tick fetches. Two targets: the launchd tick
# runs on a Mac, the CI tick on ubuntu-latest.
concurrency:
  # N counts the tags already cut, so two releases never race for one
  group: release

jobs:
  build:
    needs: version
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # mise.toml's rust pin alone: hk and cargo-llvm-cov are the gate's, not the build's
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install_args: rust
      # releases stay off shared compiler caches: local, never restored or saved
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        with:
          backend: local
      # ROUTINE_VERSION is what `routine --version` reports
      - env:
          ROUTINE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cargo build --release --locked
          mkdir dist
          tar -czf dist/routine-${{ matrix.target }}.tar.gz -C target/release routine
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: routine-${{ matrix.target }}
          path: dist/routine-${{ matrix.target }}.tar.gz
    strategy:
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
  # packslip reads each archive's os and arch from its target triple: one glob, no release.toml
  release:
    needs: [build, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: dist
          pattern: routine-*
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/*.tar.gz \
            --generate-notes --target "$GITHUB_SHA" --title "v$VERSION"
      - uses: jdx/packslip@44e50e5f64551234b4a382d991bd7f7f7d021d06 # v1.11.3
        with:
          artifacts: dist/*.tar.gz
          bin: routine
          tag: v${{ needs.version.outputs.version }}
          version: ${{ needs.version.outputs.version }}
  # counted once, so both builds stamp and the release tags the same version
  version:
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # every tag, for N
          fetch-depth: 0
          persist-credentials: false
      - id: version
        run: |
          set -euo pipefail
          month=$(date -u +%Y.%-m)
          echo "version=$month.$(git tag -l "v$month.*" | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

name: release

on:
  push:
    branches: [main]

permissions:
  attestations: write # packslip attests each archive
  contents: write # the tag, the release and its assets
  id-token: write # keyless sigstore, the workflow identity
