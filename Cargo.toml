[package]
name = "routine"
version = "0.1.0"
edition = "2024"
description = "routine — executable markdown on rails"
# SPDX id, not `license-file`: crates.io and dependency scanners read `license`.
license = "PolyForm-Noncommercial-1.0.0"
readme = "README.md"
repository = "https://github.com/jgeschwendt/routines"

# The `upgrade` verb: drain, swap, smoke, settle or roll back (gigantic.dev/hotswap/).
[dependencies]
hotswap = { git = "https://github.com/jgeschwendt/hotswap", rev = "1a0bc70a3bf07f0d36337f28bc08db23135d5227" }

# Maximalist opt-out (the house lint discipline, verbatim): turn on the whole
# strict, *stable* set (clippy::pedantic), then opt out the few we disagree
# with, each with a reason. `cargo clippy -- -D warnings` promotes all of this
# to errors.
[lints.rust]
# deny, not forbid: src/sys.rs alone expects it (decision port-signals, A′)
unsafe_code = "deny"

[lints.clippy]
# Inline `#[allow]`s must carry a reason — the `noInlineConfig` discipline.
allow_attributes_without_reason = "warn"
pedantic = { level = "warn", priority = -1 }

[profile.release]
strip = true
